name: Build and Test Docker Image

on:
  push:
    branches:
      - main  # 當推送到主分支時觸發
      - dev   # 當推送到 dev 分支時觸發
      - 'features/*'  # 當推送到以 features/ 開頭的分支時觸發

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image
        run: |
          docker build -t my-app .

      - name: Run Docker container
        run: |
          docker run -d -p 3001:3001 my-app

      - name: Wait for the app to start
        run: |
          sleep 10  # 等待應用啟動

      - name: Test homepage
        run: |
          response=$(curl --write-out "%{http_code}" --silent --output /dev/null http://localhost:3001/)
          if [ "$response" -ne 200 ]; then
            echo "Homepage test failed with response code: $response"
            exit 1
          else
            echo "Homepage test passed with response code: $response"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        run: |
          docker tag my-app your-dockerhub-username/my-app:latest
          docker push your-dockerhub-username/my-app:latest

      - name: Run tests
        run: |
          # 在這裡添加您的測試命令，例如：
          # docker exec <container_id> npm test
          echo "Add your test command here" 